name: build-and-deploy

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: double-backup-509612-i1
  AR_URL: asia-south1-docker.pkg.dev
  CLUSTER_NAME: cluster-1
  LOCATION: asia-south1-a
  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
          SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}
        with:
          args: >
            -Dsonar.projectKey=chatapp
            -Dsonar.projectName=ChatApp
            -Dsonar.sources=.

      - name: Authentication-GCP-with-WIF
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{secrets.WORKLOAD_IDENTITY_PROVIDER}}
          service_account: ${{secrets.SERVICE_ACCOUNT}}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: configure-docker-to-AR
        run: |
          gcloud auth configure-docker ${{ env.AR_URL}} --quiet

      - name: build-frontend-image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/frontend:${{github.sha}} \
            -t asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/frontend:latest \
            ./frontend

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.AR_URL }}/${{ env.PROJECT_ID }}/image-hub/frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          
      - name: build-backend-image
        run: |
          docker build \
            -t asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/backend:${{github.sha}} \
            -t asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/backend:latest \
            ./backend

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.AR_URL }}/${{ env.PROJECT_ID }}/image-hub/backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: push-to-Artifact-Registry
        run: |
          docker push asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/frontend:${{github.sha}}
          docker push asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/backend:${{github.sha}}

          docker push asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/frontend:latest 
          docker push asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/backend:latest 

      - name: GKE-credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{env.CLUSTER_NAME}}
          location: ${{env.LOCATION}}
          project_id: ${{env.PROJECT_ID}}

      - name: deploy-to-GKE
        run: |
          kubectl set image deployment/backend \
          backend=asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/backend:${{github.sha}} \
          -n app

          kubectl set image deployment/frontend \
          frontend=asia-south1-docker.pkg.dev/double-backup-509612-i1/image-hub/frontend:${{github.sha}} \
          -n app

      - name: verify-Deployment
        run: |
          kubectl rollout status deployment/backend -n app --timeout=300s
          kubectl rollout status deployment/frontend -n app --timeout=300s

          kubectl get pod -n app
        
        
        
        
    
  
