apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatapp-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5001

      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5001

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
